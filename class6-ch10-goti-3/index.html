<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Hind Siliguri";font-weight:400;src:url("../science-video-template/fonts/hind-siliguri-bengali-400-normal.woff2") format("woff2");}
@font-face{font-family:"Hind Siliguri";font-weight:600;src:url("../science-video-template/fonts/hind-siliguri-bengali-600-normal.woff2") format("woff2");}
@font-face{font-family:"Hind Siliguri";font-weight:700;src:url("../science-video-template/fonts/hind-siliguri-bengali-700-normal.woff2") format("woff2");}
/* the 400 and 600 files draw the digit ১ (U+09E7) in a looped form that reads like ৯ or ৬; take that one glyph from the 700 file */
@font-face{font-family:"Hind Siliguri";font-weight:400;src:url("../science-video-template/fonts/hind-siliguri-700-digit-one.woff2") format("woff2");unicode-range:U+09E7;}
@font-face{font-family:"Hind Siliguri";font-weight:600;src:url("../science-video-template/fonts/hind-siliguri-700-digit-one.woff2") format("woff2");unicode-range:U+09E7;}
html,body{margin:0;padding:0;background:#000;}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Hind Siliguri",sans-serif;}
#gl,#svg{position:absolute;left:0;top:0;}
#ui,#fade{position:absolute;left:0;top:0;width:1920px;height:1080px;}
#fade{pointer-events:none;opacity:0;}
.abs{position:absolute;}
.chip{display:inline-block;background:rgba(15,27,61,.9);color:#fff;font-weight:700;font-size:42px;line-height:1;padding:18px 34px 14px;border-radius:46px;border:3px solid #FFC83D;letter-spacing:.5px;word-spacing:6px;}
.chip .cn{color:#FFC83D;margin-left:10px;}
.capw{left:140px;width:1640px;bottom:36px;display:flex;justify-content:center;}
.cap{background:rgba(9,14,32,.88);border-radius:26px;color:#fff;font-size:45px;font-weight:600;text-align:center;line-height:1.3;padding:20px 44px 14px;max-width:1560px;}
.qcard{background:#fff;border-radius:56px;display:block;color:#0f1b3d;font-weight:700;box-shadow:0 14px 0 rgba(0,0,0,.25);padding:44px 50px 34px;text-align:center;line-height:1.3;box-sizing:border-box;}
.trow{left:0;width:1920px;top:150px;display:flex;justify-content:center;gap:26px;}
.tchip{background:#FFC83D;color:#0f1b3d;font-weight:700;font-size:44px;line-height:1;padding:20px 36px 15px;border-radius:50px;}
.tchip.o{background:transparent;color:#FFC83D;border:4px solid #FFC83D;padding:16px 32px 11px;}
.title{left:0;width:1920px;top:262px;text-align:center;color:#fff;font-size:150px;font-weight:700;line-height:1.3;}
.title b{color:#FFC83D;}
.learn{left:0;width:1920px;top:580px;text-align:center;color:#FFC83D;font-size:48px;font-weight:600;}
.cards{left:120px;width:1680px;top:650px;display:flex;justify-content:center;gap:36px;}
.card{width:520px;height:230px;background:#1b2b5c;border-radius:36px;border:3px solid #33488c;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:600;text-align:center;line-height:1.3;box-sizing:border-box;padding:0 24px;}
.num{width:72px;height:72px;border-radius:50%;background:#FFC83D;color:#0f1b3d;font-size:48px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;margin-bottom:12px;padding-top:6px;box-sizing:border-box;flex:none;}
.term{background:#FFC83D;border-radius:48px;padding:34px 80px 24px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.3);border:6px solid #fff;}
.tb{font-size:120px;font-weight:700;color:#0f1b3d;line-height:1.25;}
.te{font-size:50px;font-weight:600;color:#3a3a5a;line-height:1.2;font-family:Arial,Helvetica,sans-serif;}
.banner{background:#FFC83D;color:#0f1b3d;font-weight:700;font-size:84px;line-height:1.2;padding:26px 80px 16px;border-radius:70px;box-shadow:0 12px 0 rgba(0,0,0,.3);}
.rrow{left:210px;width:1500px;display:flex;align-items:center;gap:36px;background:#1b2b5c;border:3px solid #33488c;border-radius:36px;padding:26px 40px 20px;box-sizing:border-box;color:#fff;font-size:50px;font-weight:600;line-height:1.35;}
.rrow .num{margin-bottom:0;width:86px;height:86px;font-size:56px;}
/* added for the motion videos */
.who{display:inline-flex;align-items:center;gap:16px;background:#fff;color:#0f1b3d;font-weight:700;font-size:40px;line-height:1;padding:14px 30px 10px 22px;border-radius:44px;border:4px solid #0f1b3d;box-shadow:0 6px 0 rgba(0,0,0,.22);}
.lab{display:inline-block;font-weight:700;font-size:40px;line-height:1;padding:13px 24px 9px;border-radius:30px;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.22);transform:translate(-50%,-50%);}
.lab.rest{background:#2a9d5c;color:#fff;}
.lab.move{background:#FFC83D;color:#1a1a2e;}
.lab.name{background:#0f1b3d;color:#fff;border:3px solid #FFC83D;font-size:40px;}
.fig{display:inline-block;background:rgba(255,255,255,.93);color:#0f1b3d;font-weight:700;font-size:42px;line-height:1;padding:14px 26px 10px;border-radius:14px;}
.vs{display:flex;align-items:center;gap:22px;background:rgba(15,27,61,.93);border:3px solid #33488c;border-radius:30px;padding:16px 30px 12px;color:#fff;font-size:42px;font-weight:600;line-height:1.2;}
</style>
</head>
